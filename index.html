<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Human & Animal Network - 預かり猫一覧</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
      background: #fffdf8;
      margin: 0;
      padding: 0;
      color: #444;
    }

    header {
      background: #fff7e6;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #f3e4c8;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    header .title {
      font-size: 1.5em;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: #d08c5b;
    }

    .menu-icon {
      cursor: pointer;
      font-size: 1.9em;
      user-select: none;
      color: #d08c5b;
    }

    nav {
      display: none;
      position: fixed;
      top: 75px;
      right: 20px;
      background: #fffdf8;
      border: 2px solid #f3e4c8;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      width: 300px;
      z-index: 2000;

      /* ← ここを追加してスクロール可能にする */
      max-height: 70vh;
      overflow-y: auto;
    }

    nav.active {
      display: block;
    }

    nav h3 {
      margin: 0;
      padding: 14px;
      font-size: 1.2em;
      border-bottom: 2px solid #f3e4c8;
      background: #fff7e6;
      border-radius: 12px 12px 0 0;
      color: #d08c5b;
    }

    nav form {
      padding: 14px;
      border-bottom: 1px solid #f3e4c8;
    }

    nav form:last-child {
      border-bottom: none;
    }

    label {
      display: block;
      margin: 10px 0 6px;
      font-size: 0.9em;
      color: #666;
    }

    input[type="text"], select {
      width: 100%;
      padding: 10px;
      border: 2px solid #f3e4c8;
      border-radius: 10px;
      background: #fff;
      font-size: 0.95em;
    }

    button {
      background-color: #f7c8a5;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 12px;
      width: 100%;
      font-size: 1em;
      letter-spacing: 0.03em;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
    }

    button:hover {
      background-color: #f3b48c;
    }

    main {
      padding: 30px 20px;
      max-width: 1000px;
      margin: auto;
      overflow-x: auto;
    }

    h2 {
      font-size: 1.4em;
      font-weight: 600;
      margin-bottom: 20px;
      padding-bottom: 6px;
      border-bottom: 2px solid #f3e4c8;
      letter-spacing: 0.03em;
      color: #d08c5b;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.05);
      min-width: 600px;
    }

    th, td {
      padding: 14px;
      text-align: left;
      border-bottom: 1px solid #f7f1e6;
      font-size: 0.95em;
    }

    th {
      background-color: #fff7e6;
      font-weight: 600;
      color: #d08c5b;
    }

    td:last-child {
      font-size: 0.9em;
      color: #666;
    }

    tr:last-child td {
      border-bottom: none;
    }

    @media (max-width: 600px) {
      header .title {
        font-size: 1.3em;
      }

      table, th, td {
        font-size: 0.85em;
      }

      nav {
        width: 90%;
        right: 5%;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="title">Human & Animal Network</div>
    <div class="menu-icon" id="menuIcon">☰</div>
  </header>

  <nav id="menu">
    <h3>メニュー</h3>

    <form id="volunteerForm">
      <h4>預かりボランティアさんの登録</h4>
      <label>ボランティアさんの名前：</label>
      <input type="text" id="volunteerName" required>

      <label>預かりMAX頭数：</label>
      <input type="text" id="maxCats" required>

      <button type="submit">追加</button>
    </form>

    <form id="catForm">
      <h4>猫の登録</h4>

      <label>ボランティアさん：</label>
      <select id="catVolunteerName" required>
        <option value="">選択してください</option>
      </select>

      <label>猫のチーム名：</label>
      <input type="text" id="catTeamName" required>

      <label>猫の名前：</label>
      <input type="text" id="catName" required>

      <button type="submit">追加</button>
    </form>
  </nav>

  <main>
    <h2>預かり猫一覧</h2>

    <table>
      <thead>
        <tr>
          <th>ボランティアさん</th>
          <th>預かり頭数</th>
          <th>MAX頭数</th>
          <th>猫一覧</th>
        </tr>
      </thead>
      <tbody id="volunteerTableBody"></tbody>
    </table>
  </main>

  <script>
    const volunteers = {};
    const volunteerForm = document.getElementById('volunteerForm');
    const catForm = document.getElementById('catForm');
    const volunteerTableBody = document.getElementById('volunteerTableBody');
    const catVolunteerSelect = document.getElementById('catVolunteerName');
    const menuIcon = document.getElementById('menuIcon');
    const menu = document.getElementById('menu');

    menuIcon.addEventListener('click', () => {
      menu.classList.toggle('active');
    });

    volunteerForm.addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('volunteerName').value.trim();
      const maxCats = document.getElementById('maxCats').value.trim();
      if (!name || !maxCats) return;

      if (!volunteers[name]) {
        volunteers[name] = { max: parseInt(maxCats), cats: [] };
        const option = document.createElement('option');
        option.value = name;
        option.textContent = name;
        catVolunteerSelect.appendChild(option);
        renderTable();
      } else {
        alert('このボランティアさんは既に登録されています。');
      }

      document.getElementById('volunteerName').value = '';
      document.getElementById('maxCats').value = '';
    });

    catForm.addEventListener('submit', e => {
      e.preventDefault();
      const volunteerName = catVolunteerSelect.value;
      const teamName = document.getElementById('catTeamName').value.trim();
      const catName = document.getElementById('catName').value.trim();

      if (!volunteerName || !teamName || !catName) return;

      volunteers[volunteerName].cats.push({ team: teamName, name: catName });
      renderTable();

      document.getElementById('catTeamName').value = '';
      document.getElementById('catName').value = '';
    });

    function renderTable() {
      volunteerTableBody.innerHTML = '';
      Object.keys(volunteers).forEach(volName => {
        const data = volunteers[volName];
        const tr = document.createElement('tr');

        tr.innerHTML = `
          <td>${volName}</td>
          <td>${data.cats.length}</td>
          <td>${data.max}</td>
          <td>${data.cats.length ? data.cats.map(cat => `${cat.team} / ${cat.name}`).join('、 ') : 'なし'}</td>
        `;

        volunteerTableBody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
