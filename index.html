<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Human & Animal Network - 預かり猫一覧</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
      background: #fffdf8;
      margin: 0;
      padding: 0;
      color: #444;
    }

    header {
      background: #fff7e6;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #f3e4c8;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    header .title {
      font-size: 1.5em;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: #d08c5b;
    }

    .menu-icon {
      cursor: pointer;
      font-size: 1.9em;
      user-select: none;
      color: #d08c5b;
    }

    nav {
      display: none;
      position: fixed;
      top: 75px;
      right: 20px;
      background: #fffdf8;
      border: 2px solid #f3e4c8;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      width: 300px;
      z-index: 2000;
      max-height: 70vh;
      overflow-y: auto;
    }

    nav.active {
      display: block;
    }

    nav h3 {
      margin: 0;
      padding: 14px;
      font-size: 1.2em;
      border-bottom: 2px solid #f3e4c8;
      background: #fff7e6;
      border-radius: 12px 12px 0 0;
      color: #d08c5b;
    }

    nav form {
      padding: 14px;
      border-bottom: 1px solid #f3e4c8;
    }

    nav form:last-child {
      border-bottom: none;
    }

    label {
      display: block;
      margin: 10px 0 6px;
      font-size: 0.9em;
      color: #666;
    }

    input[type="text"], select {
      width: 100%;
      padding: 10px;
      border: 2px solid #f3e4c8;
      border-radius: 10px;
      background: #fff;
      font-size: 0.95em;
    }

    button {
      background-color: #f7c8a5;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 12px;
      width: 100%;
      font-size: 1em;
      letter-spacing: 0.03em;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
    }

    button:hover {
      background-color: #f3b48c;
    }

    main {
      padding: 30px 20px;
      max-width: 1000px;
      margin: auto;
      overflow-x: auto;
    }

    h2 {
      font-size: 1.4em;
      font-weight: 600;
      margin-bottom: 20px;
      padding-bottom: 6px;
      border-bottom: 2px solid #f3e4c8;
      letter-spacing: 0.03em;
      color: #d08c5b;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.05);
      min-width: 700px;
    }

    th, td {
      padding: 14px;
      text-align: left;
      border-bottom: 1px solid #f7f1e6;
      font-size: 0.95em;
      vertical-align: top;
    }

    th {
      background-color: #fff7e6;
      font-weight: 600;
      color: #d08c5b;
    }

    .cat-name {
      cursor: pointer;
      display: inline-block;
      padding: 4px 0;
    }

    .delete-btn {
      background: #e38b8b;
      border: none;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85em;
      color: #fff;
      margin-top: 4px;
      display: none;
    }

    .delete-btn:hover {
      background: #d66f6f;
    }

    .edit-btn {
      background: #f7c8a5;
      border: none;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85em;
      color: #fff;
      margin-top: 6px;
    }

    .edit-btn:hover {
      background: #f3b48c;
    }

    /* モーダル */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      justify-content: center;
      align-items: center;
      z-index: 3000;
    }

    .modal-content {
      background: #fffdf8;
      padding: 20px;
      border-radius: 14px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }

    .modal-content h3 {
      margin-top: 0;
      color: #d08c5b;
      border-bottom: 2px solid #f3e4c8;
      padding-bottom: 8px;
    }

    .cancel-btn {
      background: #bbb;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <header>
    <div class="title">Human & Animal Network</div>
    <div class="menu-icon" id="menuIcon">☰</div>
  </header>

  <nav id="menu">
    <h3>メニュー</h3>

    <form id="volunteerForm">
      <h4>預かりボランティアさんの登録</h4>

      <label>ボランティアさんの名前：</label>
      <input type="text" id="volunteerName" required>

      <label>子猫MAX頭数：</label>
      <input type="text" id="maxKittens" required>

      <label>成猫MAX頭数：</label>
      <input type="text" id="maxAdults" required>

      <button type="submit">追加</button>
    </form>

    <form id="catForm">
      <h4>猫の登録</h4>

      <label>ボランティアさん：</label>
      <select id="catVolunteerName" required>
        <option value="">選択してください</option>
      </select>

      <label>猫のチーム名：</label>
      <input type="text" id="catTeamName" required>

      <label>猫の名前：</label>
      <input type="text" id="catName" required>

      <button type="submit">追加</button>
    </form>
  </nav>

  <main>
    <h2>預かり猫一覧</h2>

    <table>
      <thead>
        <tr>
          <th>ボランティアさん</th>
          <th>子猫MAX</th>
          <th>成猫MAX</th>
          <th>預かり頭数</th>
          <th>猫一覧</th>
          <th>編集</th>
        </tr>
      </thead>
      <tbody id="volunteerTableBody"></tbody>
    </table>
  </main>

  <!-- 編集モーダル -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <h3>ボランティア情報の編集</h3>

      <label>名前：</label>
      <input type="text" id="editName">

      <label>子猫MAX頭数：</label>
      <input type="text" id="editKittens">

      <label>成猫MAX頭数：</label>
      <input type="text" id="editAdults">

      <button onclick="saveEdit()">保存</button>
      <button class="cancel-btn" onclick="closeModal()">キャンセル</button>
    </div>
  </div>

  <script>
    const volunteers = {};
    let editingVolunteer = null;

    function saveData() {
      localStorage.setItem("volunteers", JSON.stringify(volunteers));
    }

    function loadData() {
      const saved = localStorage.getItem("volunteers");
      if (saved) {
        Object.assign(volunteers, JSON.parse(saved));
      }
    }

    loadData();

    const volunteerForm = document.getElementById('volunteerForm');
    const catForm = document.getElementById('catForm');
    const volunteerTableBody = document.getElementById('volunteerTableBody');
    const catVolunteerSelect = document.getElementById('catVolunteerName');
    const menuIcon = document.getElementById('menuIcon');
    const menu = document.getElementById('menu');

    menuIcon.addEventListener('click', () => {
      menu.classList.toggle('active');
    });

    volunteerForm.addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('volunteerName').value.trim();
      const maxKittens = document.getElementById('maxKittens').value.trim();
      const maxAdults = document.getElementById('maxAdults').value.trim();

      if (!name || !maxKittens || !maxAdults) return;

      if (!volunteers[name]) {
        volunteers[name] = {
          maxKittens: parseInt(maxKittens),
          maxAdults: parseInt(maxAdults),
          cats: []
        };

        saveData();
        renderTable();
      } else {
        alert('このボランティアさんは既に登録されています。');
      }

      document.getElementById('volunteerName').value = '';
      document.getElementById('maxKittens').value = '';
      document.getElementById('maxAdults').value = '';
    });

    catForm.addEventListener('submit', e => {
      e.preventDefault();
      const volunteerName = catVolunteerSelect.value;
      const teamName = document.getElementById('catTeamName').value.trim();
      const catName = document.getElementById('catName').value.trim();

      if (!volunteerName || !teamName || !catName) return;

      volunteers[volunteerName].cats.push({
        team: teamName,
        name: catName
      });

      saveData();
      renderTable();

      document.getElementById('catTeamName').value = '';
      document.getElementById('catName').value = '';
    });

    function renderTable() {
      volunteerTableBody.innerHTML = '';

      Object.keys(volunteers).forEach(volName => {
        const data = volunteers[volName];
        const tr = document.createElement('tr');

        const catsHTML = data.cats
          .map((cat, index) => `
            <div>
              <span class="cat-name" onclick="toggleDelete('${volName}', ${index})">
                ${cat.team} / ${cat.name}
              </span>
              <button class="delete-btn" id="delete-${volName}-${index}"
                onclick="deleteCat('${volName}', ${index})">
                削除
              </button>
            </div>
          `)
          .join("");

        tr.innerHTML = `
          <td>
            <span style="cursor:pointer; color:#d08c5b;" onclick="openEditModal('${volName}')">
              ${volName}
            </span>
          </td>
          <td>${data.maxKittens}</td>
          <td>${data.maxAdults}</td>
          <td>${data.cats.length}</td>
          <td>${catsHTML || 'なし'}</td>
          <td>
            <button class="edit-btn" onclick="openEditModal('${volName}')">編集</button>
          </td>
        `;

        volunteerTableBody.appendChild(tr);
      });

      updateVolunteerSelect();
    }

    function toggleDelete(volName, index) {
      const btn = document.getElementById(`delete-${volName}-${index}`);
      btn.style.display = btn.style.display === "inline-block" ? "none" : "inline-block";
    }

    function deleteCat(volName, index) {
      volunteers[volName].cats.splice(index, 1);
      saveData();
      renderTable();
    }

    function updateVolunteerSelect() {
      catVolunteerSelect.innerHTML = '<option value="">選択してください</option>';
      Object.keys(volunteers).forEach(name => {
        const option = document.createElement('option');
        option.value = name;
        option.textContent = name;
        catVolunteerSelect.appendChild(option);
      });
    }

    function openEditModal(volName) {
      editingVolunteer = volName;
      const data = volunteers[volName];

      document.getElementById("editName").value = volName;
      document.getElementById("editKittens").value = data.maxKittens;
      document.getElementById("editAdults").value = data.maxAdults;

      document.getElementById("editModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("editModal").style.display = "none";
    }

    function saveEdit() {
      const newName = document.getElementById("editName").value.trim();
      const newKittens = parseInt(document.getElementById("editKittens").value.trim());
      const newAdults = parseInt(document.getElementById("editAdults").value.trim());

      const oldData = volunteers[editingVolunteer];
      delete volunteers[editingVolunteer];

      volunteers[newName] = {
        maxKittens: newKittens,
        maxAdults: newAdults,
        cats: oldData.cats
      };

      saveData();
      closeModal();
      renderTable();
    }

    renderTable();
  </script>
</body>
</html>
