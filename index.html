<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>保護猫ボランティア管理</title>
  <style>
    body {
      font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
      background: #fffaf0;
      margin: 0;
      padding: 0;
    }
    header {
      background: linear-gradient(to right, #fceabb, #f8b500);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #333;
      font-weight: bold;
      font-size: 1.4em;
    }
    /* ハンバーガーメニュー */
    .menu-icon {
      cursor: pointer;
      font-size: 1.6em;
    }
    nav {
      display: none;
      position: absolute;
      top: 60px;
      right: 20px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 250px;
      z-index: 100;
    }
    nav.active {
      display: block;
    }
    nav h3 {
      background: #f8b500;
      color: white;
      margin: 0;
      padding: 10px;
      border-radius: 8px 8px 0 0;
    }
    nav form {
      padding: 10px;
    }
    label {
      display: block;
      margin: 8px 0;
    }
    input[type="text"], select {
      width: 100%;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background-color: #f8b500;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #e0a800;
    }
    main {
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }
    h2 {
      font-size: 1.4em;
      color: #444;
      border-bottom: 2px solid #f8b500;
      padding-bottom: 5px;
      margin-bottom: 15px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #fff3cd;
    }
    .cat-list {
      font-size: 0.9em;
      color: #555;
    }
  </style>
</head>
<body>
  <header>
    保護猫ボランティア管理
    <div class="menu-icon" id="menuIcon">☰</div>
  </header>

  <!-- ハンバーガーメニュー -->
  <nav id="menu">
    <h3>メニュー</h3>
    <form id="volunteerForm">
      <h4>預かりボランティアさんの登録</h4>
      <label>ボランティアさんの名前：
        <input type="text" id="volunteerName" required>
      </label>
      <label>預かりMAX頭数：
        <input type="text" id="maxCats" required>
      </label>
      <button type="submit">ボランティアを追加</button>
    </form>
    <form id="catForm">
      <h4>猫の登録</h4>
      <label>ボランティアさんの名前：
        <select id="catVolunteerName" required>
          <option value="">選択してください</option>
        </select>
      </label>
      <label>猫のチーム名：
        <input type="text" id="catTeamName" required>
      </label>
      <label>猫の名前：
        <input type="text" id="catName" required>
      </label>
      <button type="submit">猫を追加</button>
    </form>
  </nav>

  <main>
    <h2>預かり猫一覧</h2>
    <table>
      <thead>
        <tr>
          <th>ボランティアさんの名前</th>
          <th>預かり頭数</th>
          <th>預かりMAX頭数</th>
          <th>猫一覧（チーム名＋猫の名前）</th>
        </tr>
      </thead>
      <tbody id="volunteerTableBody"></tbody>
    </table>
  </main>

  <script>
    const volunteers = {};
    const volunteerForm = document.getElementById('volunteerForm');
    const catForm = document.getElementById('catForm');
    const volunteerTableBody = document.getElementById('volunteerTableBody');
    const catVolunteerSelect = document.getElementById('catVolunteerName');
    const menuIcon = document.getElementById('menuIcon');
    const menu = document.getElementById('menu');

    menuIcon.addEventListener('click', () => {
      menu.classList.toggle('active');
    });

    volunteerForm.addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('volunteerName').value.trim();
      const maxCats = document.getElementById('maxCats').value.trim();
      if (!name || !maxCats) return;

      if (!volunteers[name]) {
        volunteers[name] = { max: parseInt(maxCats), cats: [] };
        const option = document.createElement('option');
        option.value = name;
        option.textContent = name;
        catVolunteerSelect.appendChild(option);
        renderTable();
      } else {
        alert('このボランティアさんは既に登録されています。');
      }

      document.getElementById('volunteerName').value = '';
      document.getElementById('maxCats').value = '';
    });

    catForm.addEventListener('submit', e => {
      e.preventDefault();
      const volunteerName = catVolunteerSelect.value;
      const teamName = document.getElementById('catTeamName').value.trim();
      const catName = document.getElementById('catName').value.trim();

      if (!volunteerName || !teamName || !catName) return;

      volunteers[volunteerName].cats.push({ team: teamName, name: catName });
      renderTable();

      document.getElementById('catTeamName').value = '';
      document.getElementById('catName').value = '';
    });

    function renderTable() {
      volunteerTableBody.innerHTML = '';
      Object.keys(volunteers).forEach(volName => {
        const data = volunteers[volName];
        const tr = document.createElement('tr');

        const tdName = document.createElement('td');
        tdName.textContent = volName;

        const tdCount = document.createElement('td');
        tdCount.textContent = data.cats.length;

        const tdMax = document.createElement('td');
        tdMax.textContent = data.max;

        const tdCats = document.createElement('td');
        tdCats.textContent = data.cats.length
          ? data.cats.map(cat => `${cat.team} / ${cat.name}`).join('、 ')
          : 'なし';

        tr.append(tdName, tdCount, tdMax, tdCats);
        volunteerTableBody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
